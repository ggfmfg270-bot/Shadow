<style>

body{margin:0;background:radial-gradient(900px 400px at 50% -100px,#2a1560,var(--bg));color:var(--tx);font-family:system-ui,Tahoma,sans-serif;min-height:100vh;padding-bottom:80px}

async anime(){const{data:a}=await sb.from("anime").select("*,episodes(*)").eq("id",p.id).single();if(!a)return"<p>غير موجود</p>";const es=a.episodes.sort((x,y)=>x.number-y.number);let seen={},fav=false;
 if(me){const[h,f]=await Promise.all([sb.from("history").select("episode_id").eq("anime_id",a.id).eq("done",true),sb.from("favorites").select("anime_id").eq("anime_id",a.id)]);(h.data||[]).forEach(x=>seen[x.episode_id]=1);fav=!!f.data?.length}
 return `<button class="g" data-a="home">→ رجوع</button><div style="display:flex;gap:14px;margin-top:12px">${a.cover?`<img src="${esc(a.cover)}" style="width:120px;border-radius:14px;aspect-ratio:2/3;object-fit:cover">`:`<div class="ph" style="width:120px;border-radius:14px">SHADOW</div>`}<div><h2 style="margin:0">${esc(a.name)}</h2><p class="mu">${esc(a.cat)} · ${esc(a.year)} · ${esc(a.status)}<br>الناشر: ${esc(a.publisher)}<br>الحلقات المنشورة: ${es.length}${a.total?` من ${a.total}`:""}</p></div></div><p>${esc(a.descr)}</p>

 ${own(a)?`<div class="bar"><button class="g" data-a="addep" data-i="${a.id}">+ إضافة حلقات</button><button class="d" data-a="delanime" data-i="${a.id}">حذف الأنمي</button></div>`:""}<h2>الحلقات</h2>
 ${es.map(e=>`<div class="ep ${seen[e.id]?"seen":""}" data-a="play" data-e="${e.id}"><span>الحلقة ${e.number} — ${esc(e.title)}</span><span>${seen[e.id]?"✓ ":""}▶ ${own(a)?`<button class="d" data-a="delep" data-i="${e.id}" style="padding:4px 10px">حذف</button>`:""}</span></div>`).join("")||`<p class="mu">لم تُنشر حلقات بعد.</p>`}`},
async watch(){const{data:e}=await sb.from("episodes").select("*").eq("id",p.e).single();if(!e)return"<p>الحلقة غير موجودة</p>";const{data:l}=await sb.from("episodes").select("id,number").eq("anime_id",e.anime_id).order("number");const i=l.findIndex(x=>x.id===e.id);p={...p,e,l,i,pr:0};

async add(){return me?pub()?`<h2>نشر أنمي جديد</h2><input id="n" placeholder="اسم الأنمي"><label class="mu">صورة الغلاف (حتى 5 ميغابايت)</label><input id="cv" type="file" accept="image/*"><textarea id="d" rows="3" placeholder="وصف القصة"></textarea><select id="c">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="y" type="number" placeholder="سنة الإصدار"><select id="s"><option>مستمر</option><option>مكتمل</option></select><input id="pb" placeholder="اسم الناشر" value="${esc(me.name)}"><input id="k" type="number" min="1" placeholder="عدد الحلقات"><button data-a="saveanime" style="width:100%;margin-top:8px">إنشاء الأنمي</button>`:`<h2>النشر</h2><p class="mu">حسابك مشاهد. اطلب من المدير ترقيته إلى ناشر.</p>`:auth()},
async addep(){const{data:a}=await sb.from("anime").select("id,name").eq("id",p.id).single();return `<button class="g" data-a="open" data-i="${a.id}">→ ${esc(a.name)}</button><h2>إضافة حلقة</h2><input id="en" type="number" min="1" placeholder="رقم الحلقة"><input id="et" placeholder="عنوان الحلقة"><textarea id="ed" rows="2" placeholder="وصف (اختياري)"></textarea><label class="mu">ارفع ملف الحلقة (mp4/webm حتى 50 ميغابايت)</label><input id="ef" type="file" accept="video/mp4,video/webm"><input id="eu" placeholder="أو رابط فيديو مباشر مصرح به"><button data-a="saveep" style="width:100%;margin-top:8px">حفظ الحلقة</button><h2>إضافة دفعة (روابط)</h2><textarea id="bulk" rows="4" placeholder="رقم | عنوان | رابط&#10;1 | الأولى | https://…/1.mp4"></textarea><button class="g" data-a="bulk" style="width:100%">إضافة الدفعة</button>`},

async function R(){const f=document.activeElement?.id;let h;try{h=await V_[v]()}catch(e){h=`<div class="msg">${M(e)}</div>`}
 $("#app").innerHTML=(err?`<div class="msg">${esc(err)}</div>`:"")+(ok?`<div class="msg ok">${esc(ok)}</div>`:"")+h;
 $("#nav").innerHTML=[["home","الرئيسية"],["add","نشر"],["acct",me?"حسابي":"دخول"]].map(([k,t])=>`<span class="${v===k?"on":""}" data-a="${k}">${t}</span>`).join("");
 const qi=$("#q");if(qi)qi.onchange=e=>{q=e.target.value;R()};
 const vp=$("#vp");if(vp&&p.e){const e=p.e;let t=0;vp.onloadedmetadata=()=>{if(p.pr&&p.pr<vp.duration-5)vp.currentTime=p.pr};
  const sv=d=>me&&sb.from("history").upsert({user_id:me.id,episode_id:e.id,anime_id:e.anime_id,position:Math.floor(vp.currentTime),done:d,updated_at:new Date().toISOString()});
  vp.ontimeupdate=()=>{if(Date.now()-t>8000){t=Date.now();sv(false)}};vp.onerror=()=>{$("#verr").innerHTML='<div class="msg">تعذر تشغيل هذه الحلقة. تحقق من الاتصال أو الرابط.</div>'};
  vp.onended=async()=>{await sv(true);const n=p.l[p.i+1];if(auto&&n)go("watch",{e:n.id})};$("#auto").onchange=x=>auto=x.target.checked}}
async function addEp(aid,n,t,d,u){n=+n;if(!(n>0))throw"رقم الحلقة غير صالح";if(!t)throw"أدخل عنوان الحلقة";if(!/^https?:\/\//.test(u||""))throw"أضف رابط فيديو صالحًا أو ارفع ملفًا";const{error}=await sb.from("episodes").insert({anime_id:aid,number:n,title:t,descr:d||"",video_url:u});if(error)throw error}
